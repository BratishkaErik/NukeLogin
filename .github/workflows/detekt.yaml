name: Detekt
permissions:
  security-events: write
  contents: read
on:
  merge_group:
  push:
    branches: "**"
    paths-ignore:
      - "LICENSE/**"
      - "README.md"
      - "REUSE.toml"
      - ".gitignore"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "LICENSE/**"
      - "README.md"
      - "REUSE.toml"
      - ".gitignore"
jobs:
  build:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@e3d2460bbb42d7710191569f88069044cfb9d8cf
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@0eda626a36b219e8e4eb4073a97da49474c02687
        with:
          gradle-version: "8.12"
      - run: gradle detekt
      # Make sure we always run this upload task,
      # because the previous step may fail if there are findings.
      - name: Upload SARIF to GitHub using the upload-sarif action
        uses: github/codeql-action/upload-sarif@83923549f688e42b34d0b90ee94725f7c30532fc
        if: success() || failure()
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt
