name: Gradle
permissions:
  contents: read
on:
  merge_group:
  push:
    branches: "**"
    paths-ignore:
      - "LICENSE/**"
      - "README.md"
      - "REUSE.toml"
      - ".gitignore"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "LICENSE/**"
      - "README.md"
      - "REUSE.toml"
      - ".gitignore"
jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@e3d2460bbb42d7710191569f88069044cfb9d8cf
        with:
          persist-credentials: false
      - name: Setup Java 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Setup Gradle 8.12
        uses: gradle/actions/setup-gradle@0eda626a36b219e8e4eb4073a97da49474c02687
        with:
          gradle-version: "8.12"
      - run: gradle build
      - name: Upload JAR artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: NukeLogin-dev
          path: build/libs/NukeLogin-*-all.jar
